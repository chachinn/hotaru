  <style>
    .team-unowned{position:relative;z-index:2;touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none}
    .hotaru-startup{min-height:100dvh;padding:max(18px,env(safe-area-inset-top)) 22px calc(24px + env(safe-area-inset-bottom));box-sizing:border-box;background:linear-gradient(180deg,#fffafb 0%,#fff7fa 55%,#fffafb 100%);color:#332d31;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .hotaru-startup-head{display:flex;align-items:center;gap:12px;margin:54px 0 28px}.hotaru-startup-head img{width:50px;height:50px;border-radius:16px}.hotaru-startup-head strong{font-size:28px}.hotaru-startup-card{max-width:640px;margin:0 auto;padding:24px;border-radius:28px;background:rgba(255,255,255,.9);box-shadow:0 12px 36px rgba(214,116,151,.12)}.hotaru-startup-line{height:12px;border-radius:999px;background:#f7e8ee;margin:12px 0;overflow:hidden}.hotaru-startup-line:after{content:"";display:block;width:42%;height:100%;border-radius:inherit;background:#f4aec5;animation:hotaru-startup 1.1s ease-in-out infinite alternate}.hotaru-startup-card h2{margin:0 0 8px;font-size:22px}.hotaru-startup-card p{margin:0;color:#877d83;line-height:1.45}@keyframes hotaru-startup{from{transform:translateX(-25%)}to{transform:translateX(185%)}}

  <title>Hotaru — Character Build Companion</title>
</head>
<body>
  <div id="app" class="app-shell" aria-live="polite"><div class="hotaru-startup"><div class="hotaru-startup-head"><img src="icons/icon-192.png" alt="" /><strong>Hotaru</strong></div><div class="hotaru-startup-card"><h2>Opening your builds…</h2><p>Your saved app shell is ready while character data finishes loading.</p><div class="hotaru-startup-line"></div><div class="hotaru-startup-line"></div><div class="hotaru-startup-line"></div></div></div></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="modal-root"></div>
  <script>
    // Emergency v48 recovery runs inline so a v47 worker stuck in Cache Storage cannot block the updater script itself.
    (()=>{
      if(!('serviceWorker' in navigator))return;
      const key='hotaru.pwa-reload.v48';
      navigator.serviceWorker.addEventListener('controllerchange',()=>{
        try{if(sessionStorage.getItem(key))return;sessionStorage.setItem(key,'1')}catch{}
        location.reload();
      });
      navigator.serviceWorker.register('./service-worker.js',{updateViaCache:'none'}).then(reg=>reg.update()).catch(()=>{});
    })();
  </script>
  <script src="js/pwa-update.js?v=1.1.2"></script>
  <script type="module">
    const settleWithin=(promise,ms=1800,fallback=null)=>{let timer;return Promise.race([Promise.resolve(promise).catch(()=>fallback),new Promise(resolve=>{timer=setTimeout(()=>resolve(fallback),ms)})]).finally(()=>clearTimeout(timer))};
    const hydrateReviewedData=async()=>{
      try{
        // Character-review delivery still clears known stale modules, but never before first paint.
        if ('caches' in window) {
          const staleBuildProfiles=[
            new URL('./js/core/cache.js',location.href).href,
            new URL('./js/data/game-data.js',location.href).href,
            new URL('./js/features/build-profiles.js',location.href).href,
            new URL('./js/data/build-profiles/index.js',location.href).href,
            new URL('./js/data/build-profiles/aino.js',location.href).href,
            new URL('./js/data/build-profiles/albedo.js',location.href).href,
            new URL('./js/data/build-profiles/aloy.js',location.href).href,
            new URL('./js/data/build-profiles/alhaitham.js',location.href).href,
            new URL('./js/data/build-profiles/arlecchino.js',location.href).href,
            new URL('./js/data/build-profiles/columbina.js',location.href).href,
            new URL('./js/data/build-profiles/clorinde.js',location.href).href,
            new URL('./js/data/team-profiles/index.js',location.href).href,
            new URL('./js/data/team-profiles/aino.js',location.href).href,
            new URL('./js/data/team-profiles/albedo-reviewed.js',location.href).href,
            new URL('./js/data/team-profiles/aloy-reviewed.js',location.href).href,
            new URL('./js/data/team-profiles/alhaitham.js',location.href).href,
            new URL('./js/data/team-profiles/arlecchino-reviewed.js',location.href).href,
            new URL('./js/data/team-profiles/columbina-reviewed.js',location.href).href,
            new URL('./js/data/team-profiles/clorinde-reviewed.js',location.href).href,
            new URL('./js/data/team-recommendations.js',location.href).href,
            new URL('./js/data/character-compatibility/aino.js',location.href).href,
            new URL('./js/data/character-compatibility/albedo.js',location.href).href,
            new URL('./js/data/character-compatibility/aloy.js',location.href).href,
            new URL('./js/data/character-compatibility/alhaitham.js',location.href).href,
            new URL('./js/data/character-compatibility/arlecchino.js',location.href).href,
            new URL('./js/data/character-compatibility/columbina.js',location.href).href,
            new URL('./js/data/character-compatibility/clorinde.js',location.href).href,
            new URL('./js/data/equipment-farm-registry.js',location.href).href,
            new URL('./js/features/guide-ui.js',location.href).href,
            new URL('./js/features/game8-guide-ui.js',location.href).href,
            new URL('./js/features/guide-item-details.js',location.href).href,
            new URL('./js/features/flexible-pair-builder.js',location.href).href,
            new URL('./js/features/aloy-reviewed-bootstrap.js?v=1.0.1',location.href).href,
            new URL('./js/features/arlecchino-reviewed-bootstrap.js?v=1.0.1',location.href).href,
            new URL('./js/features/arlecchino-smart-team-guard.js?v=1.0.0',location.href).href,
            new URL('./css/character-mobile-ux.css?v=1.0.0',location.href).href,
            new URL('./js/features/character-mobile-ux.js?v=1.0.0',location.href).href
          ];
          const cacheNames=await settleWithin(caches.keys(),1200,[]);
          await settleWithin(Promise.allSettled((cacheNames||[]).filter(name=>name.startsWith('hotaru-shell-')).map(async name=>{
            const cache=await settleWithin(caches.open(name),1200,null);
            if(cache)await settleWithin(Promise.allSettled(staleBuildProfiles.map(url=>cache.delete(url))),1400,null);
          })),1800,null);
        }
        await import('./js/features/aloy-reviewed-bootstrap.js?v=1.0.2');
        document.dispatchEvent(new CustomEvent('hotaru:reviewed-data-ready'));
      }catch(error){console.warn('Reviewed data hydration deferred:',error)}
    };
    const scheduleReviewedHydration=()=>{
      if('requestIdleCallback' in window)requestIdleCallback(()=>hydrateReviewedData(),{timeout:1800});
      else setTimeout(()=>hydrateReviewedData(),250);
    };
    if(document.readyState==='complete')scheduleReviewedHydration();
    else addEventListener('load',scheduleReviewedHydration,{once:true});
  </script>

  <script type="module">
    const settleWithin=(promise,ms=1800,fallback=null)=>{let timer;return Promise.race([Promise.resolve(promise).catch(()=>fallback),new Promise(resolve=>{timer=setTimeout(()=>resolve(fallback),ms)})]).finally(()=>clearTimeout(timer))};
    // Account-ranking hotfix: clear only the cached scoring modules before the existing Smart Team controller loads.
    if ('caches' in window) {
      const stale=[
        new URL('./js/features/roster-team-matcher.js',location.href).href,
        new URL('./js/features/team-scoring.js',location.href).href,
        new URL('./js/features/abyss-team-planner.js',location.href).href,
        new URL('./js/features/abyss-intelligence.js',location.href).href,
        new URL('./js/features/smart-team-build-recommendations.js',location.href).href,
        new URL('./js/features/smart-team-v48-enhancements.js',location.href).href
      ];
      const cacheNames=await settleWithin(caches.keys(),1200,[]);
      await settleWithin(Promise.allSettled((cacheNames||[]).filter(name=>name.startsWith('hotaru-shell-')).map(async name=>{
        const cache=await settleWithin(caches.open(name),1200,null);
        if(cache)await settleWithin(Promise.allSettled(stale.map(url=>cache.delete(url))),1400,null);
      })),1800,null);
    }
    await import('./js/features/smart-team-mobile-controller.js?v=1.0.6');
  </script>
  <script type="module" src="js/features/smart-team-results-pagination.js?v=1.2.2&hotfix=52"></script>
  <script type="module" src="js/features/smart-team-mobile-result-menus.js?v=1.1.0"></script>
  <script type="module" src="js/features/smart-team-filter-scroll-fix.js?v=1.0.1"></script>
  <script type="module" src="js/features/smart-team-v48-enhancements.js?v=1.0.0"></script>
</body>
