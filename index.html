<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#f58fb0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Hotaru" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="application-name" content="Hotaru" />
  <meta name="description" content="Hotaru is an unofficial Genshin Impact character build companion for weapons, artifacts, stats, roster planning, farming guidance and an interactive map." />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="icon" href="icons/icon-192.png" sizes="192x192" />
  <link rel="stylesheet" href="style.css?v=1.8.1" />
  <link rel="stylesheet" href="css/enhancements.css?v=1.4.0" />
  <link rel="stylesheet" href="css/content-enhancements.css?v=1.0.0" />
  <link rel="stylesheet" href="css/guide-ui.css?v=1.4.0" />
  <link rel="stylesheet" href="css/exploration-ui.css?v=1.0.0" />
  <link rel="stylesheet" href="css/roster-ui.css?v=1.0.0" />
  <link rel="stylesheet" href="css/navigation-refresh.css?v=1.1.0" />
  <link rel="stylesheet" href="css/roster-sections-team-filter.css?v=1.3.0" />
  <link rel="stylesheet" href="css/smart-team-v48.css?v=1.0.2" />
  <link rel="stylesheet" href="css/character-mobile-ux.css?v=1.0.0" />
  <style>.team-unowned{position:relative;z-index:2;touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none}</style>
  <title>Hotaru — Character Build Companion</title>
</head>
<body>
  <div id="app" class="app-shell" aria-live="polite"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="modal-root"></div>
  <script src="js/pwa-update.js?v=1.1.0"></script>
  <script type="module">
    // Character-review delivery: refresh reviewed profile/team/compatibility and guide modules before app.js imports them.
    if ('caches' in window) {
      const staleBuildProfiles=[
        new URL('./js/features/build-profiles.js',location.href).href,
        new URL('./js/data/build-profiles/index.js',location.href).href,
        new URL('./js/data/build-profiles/aino.js',location.href).href,
        new URL('./js/data/build-profiles/albedo.js',location.href).href,
        new URL('./js/data/build-profiles/alhaitham.js',location.href).href,
        new URL('./js/data/build-profiles/arlecchino.js',location.href).href,
        new URL('./js/data/build-profiles/columbina.js',location.href).href,
        new URL('./js/data/build-profiles/clorinde.js',location.href).href,
        new URL('./js/data/team-profiles/index.js',location.href).href,
        new URL('./js/data/team-profiles/aino.js',location.href).href,
        new URL('./js/data/team-profiles/albedo-reviewed.js',location.href).href,
        new URL('./js/data/team-profiles/alhaitham.js',location.href).href,
        new URL('./js/data/team-profiles/arlecchino-reviewed.js',location.href).href,
        new URL('./js/data/team-profiles/columbina-reviewed.js',location.href).href,
        new URL('./js/data/team-profiles/clorinde-reviewed.js',location.href).href,
        new URL('./js/data/team-recommendations.js',location.href).href,
        new URL('./js/data/character-compatibility/aino.js',location.href).href,
        new URL('./js/data/character-compatibility/albedo.js',location.href).href,
        new URL('./js/data/character-compatibility/alhaitham.js',location.href).href,
        new URL('./js/data/character-compatibility/arlecchino.js',location.href).href,
        new URL('./js/data/character-compatibility/columbina.js',location.href).href,
        new URL('./js/data/character-compatibility/clorinde.js',location.href).href,
        new URL('./js/data/equipment-farm-registry.js',location.href).href,
        new URL('./js/features/guide-ui.js',location.href).href,
        new URL('./js/features/game8-guide-ui.js',location.href).href,
        new URL('./js/features/guide-item-details.js',location.href).href,
        new URL('./js/features/flexible-pair-builder.js',location.href).href,
        new URL('./js/features/arlecchino-reviewed-bootstrap.js?v=1.0.0',location.href).href,
        new URL('./js/features/arlecchino-smart-team-guard.js?v=1.0.0',location.href).href,
        new URL('./css/character-mobile-ux.css?v=1.0.0',location.href).href,
        new URL('./js/features/character-mobile-ux.js?v=1.0.0',location.href).href
      ];
      await Promise.all((await caches.keys()).filter(name=>name.startsWith('hotaru-shell-')).map(async name=>{
        const cache=await caches.open(name);
        await Promise.all(staleBuildProfiles.map(url=>cache.delete(url)));
      }));
    }
  </script>
  <script type="module" src="app.js?v=1.12.0"></script>
  <script type="module" src="js/enhancements.js?v=1.7.0"></script>
  <script type="module" src="js/content-enhancements.js?v=1.2.0"></script>
  <script type="module" src="js/features/guide-loader.js?v=1.2.0"></script>
  <script type="module" src="js/features/progression-calculator-ui.js?v=1.0.0"></script>
  <script type="module" src="js/features/navigation-refresh.js?v=1.2.0"></script>
  <script type="module" src="js/features/mobile-sync-ui.js?v=1.1.0"></script>
  <script type="module" src="js/features/character-mobile-ux.js?v=1.0.0"></script>
  <script type="module" src="js/features/arlecchino-reviewed-bootstrap.js?v=1.0.0"></script>
  <script type="module" src="js/features/arlecchino-smart-team-guard.js?v=1.0.0"></script>
  <script type="module" src="js/features/team-community-bootstrap.js?v=1.1.1"></script>
  <script type="module" src="js/features/flexible-pair-ui.js?v=1.0.4"></script>
  <script type="module" src="js/features/roster-sections-team-filter.js?v=1.3.2"></script>
  <script type="module" src="js/features/character-ownership-filter.js?v=1.0.0"></script>
  <script type="module">
    // Account-ranking hotfix: clear only the two cached scoring modules before the existing Smart Team controller loads.
    if ('caches' in window) {
      const stale=[
        new URL('./js/features/roster-team-matcher.js',location.href).href,
        new URL('./js/features/team-scoring.js',location.href).href,
        new URL('./js/features/abyss-team-planner.js',location.href).href,
        new URL('./js/features/abyss-intelligence.js',location.href).href,
        new URL('./js/features/smart-team-build-recommendations.js',location.href).href,
        new URL('./js/features/smart-team-v48-enhancements.js',location.href).href
      ];
      await Promise.all((await caches.keys()).filter(name=>name.startsWith('hotaru-shell-')).map(async name=>{
        const cache=await caches.open(name);
        await Promise.all(stale.map(url=>cache.delete(url)));
      }));
    }
    await import('./js/features/smart-team-mobile-controller.js?v=1.0.5');
  </script>
  <script type="module" src="js/features/smart-team-results-pagination.js?v=1.2.2&hotfix=52"></script>
  <script type="module" src="js/features/smart-team-mobile-result-menus.js?v=1.1.0"></script>
  <script type="module" src="js/features/smart-team-filter-scroll-fix.js?v=1.0.1"></script>
  <script type="module" src="js/features/smart-team-v48-enhancements.js?v=1.0.0"></script>
</body>
</html>
