name: Promote Smart Team Creator 2.0

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  promote:
    if: github.head_ref == 'feature/smart-team-creator-2-abyss'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/smart-team-creator-2-abyss
          fetch-depth: 0
      - name: Verify and apply exact tested patch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git merge-base HEAD origin/main)" = "c96b26f20088e9e1146ca51e433af597acebf938"
          test "$(sha256sum .hotaru-team2.chunk-1 | awk '{print $1}')" = "1799002366a6b725a1cf86e551a915269f668c764463d771f9156f54db3cbe3c"
          test "$(sha256sum .hotaru-team2.chunk-2 | awk '{print $1}')" = "4489f145e25630a3a812324589ee6478e1b93b7f8e09e6d075196e4b945da5a5"
          test "$(sha256sum .hotaru-team2.chunk-3 | awk '{print $1}')" = "2c0037101e4d56cb176922ad40de14e882a79e7de0c8675aa2c8291bac61194b"
          test "$(sha256sum .hotaru-team2.chunk-4 | awk '{print $1}')" = "740c565c8d1cbc63fd7177c5ef3586289578baf9a4ac039aa813e6527521cb4f"
          cat .hotaru-team2.chunk-1 .hotaru-team2.chunk-2 .hotaru-team2.chunk-3 .hotaru-team2.chunk-4 > /tmp/hotaru-team2-base.b64
          test "$(sha256sum /tmp/hotaru-team2-base.b64 | awk '{print $1}')" = "240067f18eac837241b2352addcdd7c95362cf5922d3829d0a945d9128731eb6"
          base64 -d /tmp/hotaru-team2-base.b64 > /tmp/hotaru-team2-base.patch.gz
          test "$(sha256sum /tmp/hotaru-team2-base.patch.gz | awk '{print $1}')" = "f294c8e9a2f0a379b6e655ef8c8d1532fb3024f69921876ad29b1deb2d917da1"
          test "$(sha256sum .hotaru-team2.additions.b64 | awk '{print $1}')" = "98a78b0de545708b0d89ecfa6cf06baa81f07d6410520c1ea5eaef3a0ae9ea1a"
          base64 -d .hotaru-team2.additions.b64 > /tmp/hotaru-team2-additions.patch.gz
          test "$(sha256sum /tmp/hotaru-team2-additions.patch.gz | awk '{print $1}')" = "e7d8ebd6a498e7687406a127b8a61900a988846a49b178aae77c11e480eca19e"
          cat /tmp/hotaru-team2-base.patch.gz /tmp/hotaru-team2-additions.patch.gz > /tmp/hotaru-team2-complete.patch.gz
          test "$(sha256sum /tmp/hotaru-team2-complete.patch.gz | awk '{print $1}')" = "1f6508d135008f9379b47d5abff2d6e542572d8e7663d69d4f865cdb3e428856"
          gzip -dc /tmp/hotaru-team2-complete.patch.gz > /tmp/hotaru-team2-complete.patch
          test "$(sha256sum /tmp/hotaru-team2-complete.patch | awk '{print $1}')" = "000989d1cd7d5ccf8cecacd542fd4216067c3737707f2340a18e1ab99533fb28"
          git apply --check /tmp/hotaru-team2-complete.patch
          git apply /tmp/hotaru-team2-complete.patch
      - name: Run full local-equivalent gate
        shell: bash
        run: |
          set -euo pipefail
          npm test
          find . -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | while IFS= read -r -d '' file; do node --check "$file" >/dev/null; done
      - name: Remove promotion helpers and verify final source scope
        shell: bash
        run: |
          set -euo pipefail
          rm -f .hotaru-team2.payload.b64 .hotaru-team2.chunk.00 .hotaru-team2.chunk-1 .hotaru-team2.chunk-2 .hotaru-team2.chunk-3 .hotaru-team2.chunk-4 .hotaru-team2.additions.b64 .github/workflows/promote-smart-team2.yml
          git add -A
          cat > /tmp/expected.txt <<'EOF'
          README.md
          app.js
          docs/ARCHITECTURE.md
          index.html
          js/core/state.js
          js/data/team-profiles/index.js
          js/features/abyss-team-planner.js
          js/features/roster-team-matcher.js
          package.json
          service-worker.js
          style.css
          tests/abyss-team-planner-tests.mjs
          tests/build-intelligence2-tests.mjs
          tests/build-map-fixes-tests.mjs
          tests/character-search-focus-tests.mjs
          tests/consistency-tests.mjs
          tests/daily-dashboard-tests.mjs
          tests/farm-today-tests.mjs
          tests/game8-structure-tests.mjs
          tests/guide-tests.mjs
          tests/mobile-content-cleanup-tests.mjs
          tests/mobile-ui-regression-tests.mjs
          tests/roster2-tests.mjs
          tests/run-tests.mjs
          tests/smart-farming-tests.mjs
          tests/smart-team-creator-tests.mjs
          EOF
          sed -i 's/^          //' /tmp/expected.txt
          git diff --cached --name-only origin/main | sort > /tmp/actual.txt
          diff -u /tmp/expected.txt /tmp/actual.txt
          test -z "$(git diff --cached --diff-filter=D --name-only origin/main)"
          test "$(wc -l < /tmp/actual.txt | tr -d ' ')" = "26"
          ! find . -maxdepth 2 -name '.hotaru-team2*' -print -quit | grep -q .
      - name: Commit clean source only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add Smart Team Creator 2.0 Abyss planner'
          git push origin HEAD:feature/smart-team-creator-2-abyss
