name: Apply Hotaru Mobile UI Fix
on:
  push:
    branches: [fix/mobile-ui-rarity-weapon-picker]
permissions:
  contents: write
jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[ui-fix-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-ui-rarity-weapon-picker
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/apply-mobile-ui-fixes.mjs
      - run: npm test
      - name: Remove temporary patch machinery
        run: |
          rm -f scripts/apply-mobile-ui-fixes.mjs .github/workflows/apply-mobile-ui-fix.yml
          rmdir scripts 2>/dev/null || true
      - name: Commit tested UI fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Hotaru mobile UI, rarity, and weapon picker [ui-fix-applied]"
          git push origin HEAD:fix/mobile-ui-rarity-weapon-picker
