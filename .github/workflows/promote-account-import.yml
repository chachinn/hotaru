name: Promote Account Import

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  promote:
    if: github.head_ref == 'fix/modal-uid-import'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/modal-uid-import
          fetch-depth: 0
      - name: Verify and apply exact tested patch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          base_sha="$(git merge-base HEAD origin/main)"
          echo "merge-base=$base_sha"
          test "$base_sha" = "26f626aed56de516866d286e15cf8e8b59bacfe3"
          test "$(sha256sum .hotaru-import.chunk-00.b64 | awk '{print $1}')" = "a66e57ec490965e70b5177994907196c84ad5f01b84141bffe57adfcf4effb86"
          test "$(sha256sum .hotaru-import.chunk-01.b64 | awk '{print $1}')" = "b66f3bcc2119a96639c1a169dbf1b8fe98e68bfce6c2e9589b6215967ba0fa92"
          test "$(sha256sum .hotaru-import.chunk-02.b64 | awk '{print $1}')" = "f7a36590b12054e4b8a1335b39a0db43627f481aa122b366d2907cf1bf8e392c"
          test "$(sha256sum .hotaru-import.chunk-03.b64 | awk '{print $1}')" = "166c76a24552332105a4bddcdfdd4fca2f15149173bcdb221bb95d4142355c1e"
          test "$(sha256sum .hotaru-import.chunk-04.b64 | awk '{print $1}')" = "511de99817c46b2ce56847c242c7fcee650d1fd11a6e8dbb8bcbc907b41f5e50"
          test "$(sha256sum .hotaru-import.chunk-05.b64 | awk '{print $1}')" = "ed6bbd1c2f73bc9dc658d73af38a235ff72a18f791dfb132e94d4bb7251d65cb"
          test "$(sha256sum .hotaru-import.chunk-06.b64 | awk '{print $1}')" = "0c00354f781185f4b77da3293383f6b49ea7df63c0bb9dae73f72ff5e35598aa"
          test "$(sha256sum .hotaru-import.chunk-07.b64 | awk '{print $1}')" = "cb9bc50c36cb600d2987bff982f665893afc87428c5ad6b1bedabc1cb55c786f"
          test "$(sha256sum .hotaru-import.chunk-08.b64 | awk '{print $1}')" = "c4bc4e1701f4a197d1ed0aa0f2b3158869da65e23d1baf8c6af6124dcc23ea46"
          cat .hotaru-import.chunk-*.b64 > /tmp/hotaru-import.payload.b64
          test "$(sha256sum /tmp/hotaru-import.payload.b64 | awk '{print $1}')" = "3ae3d8648246586c083f6cce37c92c39498855b2a9202ae28133f5b16861850b"
          base64 -d /tmp/hotaru-import.payload.b64 > /tmp/hotaru-import.patch.gz
          test "$(sha256sum /tmp/hotaru-import.patch.gz | awk '{print $1}')" = "5c209b98d70beaf7a195d89861d71ce768176d285542df53b6fe8978f6b717b8"
          gzip -dc /tmp/hotaru-import.patch.gz > /tmp/hotaru-import.patch
          test "$(sha256sum /tmp/hotaru-import.patch | awk '{print $1}')" = "65f5c7f9a0dbd5bc89579999823cab2410dd708d019c1220859dbe607399590c"
          git apply --check /tmp/hotaru-import.patch
          git apply /tmp/hotaru-import.patch
      - name: Run full local-equivalent gate
        shell: bash
        run: |
          set -euo pipefail
          npm test
          find . -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | while IFS= read -r -d '' file; do node --check "$file" >/dev/null; done
      - name: Remove helpers and verify final source scope
        shell: bash
        run: |
          set -euo pipefail
          rm -f .hotaru-import.chunk-*.b64 .github/workflows/promote-account-import.yml
          git add -A
          cat > /tmp/expected.txt <<'LIST'
          README.md
          app.js
          index.html
          js/core/state.js
          js/data/enka.js
          js/features/full-account-import.js
          js/features/uid-import.js
          package.json
          service-worker.js
          tests/abyss-intelligence-tests.mjs
          tests/abyss-team-planner-tests.mjs
          tests/build-intelligence2-tests.mjs
          tests/build-map-fixes-tests.mjs
          tests/character-search-focus-tests.mjs
          tests/consistency-tests.mjs
          tests/daily-dashboard-tests.mjs
          tests/farm-today-tests.mjs
          tests/full-account-import-tests.mjs
          tests/game8-structure-tests.mjs
          tests/guide-tests.mjs
          tests/mobile-content-cleanup-tests.mjs
          tests/mobile-ui-regression-tests.mjs
          tests/modal-uid-import-tests.mjs
          tests/roster2-tests.mjs
          tests/run-tests.mjs
          tests/smart-farming-tests.mjs
          tests/smart-team-creator-tests.mjs
          tools/hotaru-hoyolab-export.user.js
          LIST
          sed -i 's/^          //' /tmp/expected.txt
          git diff --cached --name-only origin/main | sort > /tmp/actual.txt
          sort /tmp/expected.txt -o /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/actual.txt
          test -z "$(git diff --cached --diff-filter=D --name-only origin/main)"
          test "$(wc -l < /tmp/actual.txt | tr -d ' ')" = "28"
          ! find . -maxdepth 2 -name '.hotaru-import*' -print -quit | grep -q .
      - name: Commit clean source only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Fix modal actions and add full account import'
          git push origin HEAD:fix/modal-uid-import
