name: Promote Daily Dashboard

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  promote:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Verify, apply, test, and self-clean
        shell: bash
        env:
          BASE_SHA: 5c19155c5bfe3eeb6848b0cada35b2b24e477242
          PAYLOAD_SHA: bca5c60ac33df0cf2e73772c8b37e5098e2eece34cd95fc6eb164eaa3f3964e4
          GZIP_SHA: 2ce99c1b53c76bc58f4fbbf0856e48173e1f336128b242f09b96d413cfb1be12
          PATCH_SHA: 18e8cf32808d2e12d19cac4646e61166ac76f5b0f0119011ec6e0e81eac137c2
        run: |
          set -euo pipefail
          git fetch origin main:refs/remotes/origin/main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          cat .hotaru-daily-dashboard.1.b64 .hotaru-daily-dashboard.2.b64 .hotaru-daily-dashboard.3.b64 .hotaru-daily-dashboard.4.b64 .hotaru-daily-dashboard.5.b64 .hotaru-daily-dashboard.6.b64 > /tmp/hotaru-daily-dashboard.patch.gz.b64
          test "$(sha256sum /tmp/hotaru-daily-dashboard.patch.gz.b64 | awk '{print $1}')" = "$PAYLOAD_SHA"
          base64 -d /tmp/hotaru-daily-dashboard.patch.gz.b64 > /tmp/hotaru-daily-dashboard.patch.gz
          test "$(sha256sum /tmp/hotaru-daily-dashboard.patch.gz | awk '{print $1}')" = "$GZIP_SHA"
          gzip -dc /tmp/hotaru-daily-dashboard.patch.gz > /tmp/hotaru-daily-dashboard.patch
          test "$(sha256sum /tmp/hotaru-daily-dashboard.patch | awk '{print $1}')" = "$PATCH_SHA"
          git apply --check /tmp/hotaru-daily-dashboard.patch
          git apply /tmp/hotaru-daily-dashboard.patch

          npm test
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find . -path './.git' -prune -o \( -name '*.js' -o -name '*.mjs' \) -type f -print0)

          git add README.md app.js index.html js/features/daily-dashboard.js package.json service-worker.js style.css \
            tests/build-intelligence2-tests.mjs tests/build-map-fixes-tests.mjs tests/character-search-focus-tests.mjs \
            tests/consistency-tests.mjs tests/daily-dashboard-tests.mjs tests/farm-today-tests.mjs tests/game8-structure-tests.mjs \
            tests/guide-tests.mjs tests/mobile-content-cleanup-tests.mjs tests/mobile-ui-regression-tests.mjs tests/roster2-tests.mjs \
            tests/run-tests.mjs tests/smart-farming-tests.mjs tests/smart-team-creator-tests.mjs
          git rm .hotaru-daily-dashboard.1.b64 .hotaru-daily-dashboard.2.b64 .hotaru-daily-dashboard.3.b64 .hotaru-daily-dashboard.4.b64 .hotaru-daily-dashboard.5.b64 .hotaru-daily-dashboard.6.b64 .github/workflows/promote-daily-dashboard.yml

          cat > /tmp/expected-files <<'EOF'
          README.md
          app.js
          index.html
          js/features/daily-dashboard.js
          package.json
          service-worker.js
          style.css
          tests/build-intelligence2-tests.mjs
          tests/build-map-fixes-tests.mjs
          tests/character-search-focus-tests.mjs
          tests/consistency-tests.mjs
          tests/daily-dashboard-tests.mjs
          tests/farm-today-tests.mjs
          tests/game8-structure-tests.mjs
          tests/guide-tests.mjs
          tests/mobile-content-cleanup-tests.mjs
          tests/mobile-ui-regression-tests.mjs
          tests/roster2-tests.mjs
          tests/run-tests.mjs
          tests/smart-farming-tests.mjs
          tests/smart-team-creator-tests.mjs
          EOF
          sort -o /tmp/expected-files /tmp/expected-files
          git diff --cached --name-only origin/main | sort > /tmp/actual-files
          diff -u /tmp/expected-files /tmp/actual-files
          test -z "$(git diff --cached --diff-filter=D --name-only origin/main)"
          test "$(git diff --cached --name-only origin/main | wc -l | tr -d ' ')" = "21"
          grep -q "hotaru-shell-v23" service-worker.js
          grep -q "./js/features/daily-dashboard.js" service-worker.js
          grep -q "app.js?v=1.9.0" index.html
          grep -q "style.css?v=1.6.0" index.html

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Add Daily Dashboard home"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
