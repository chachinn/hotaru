name: Finalize BI2 app source

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/bi2-app-finalize.yml'
      - '.tmp/app/**'

permissions:
  contents: write

jobs:
  finalize-app:
    if: github.head_ref == 'feature/build-intelligence-2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/build-intelligence-2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Reconstruct exact tested app.js
        shell: bash
        run: |
          set -euo pipefail
          test "$(find .tmp/app -maxdepth 1 -type f | wc -l)" -eq 9
          cat .tmp/app/part-{00..08} | tr -d '[:space:]' | base64 -d > app.js
          echo '2a15a175b13a1603e8c3f7b539de291bb840ceebdd62d53cb5c75fdd62bf54c0  app.js' | sha256sum -c -
          rm -rf .tmp/app
          rm -f .github/workflows/bi2-app-finalize.yml
      - name: Full Build Intelligence 2 QA
        shell: bash
        run: |
          set -euo pipefail
          npm test
          while IFS= read -r -d '' file; do node --check "$file" >/dev/null; done < <(find . -type f \( -name '*.js' -o -name '*.mjs' \) -not -path './node_modules/*' -print0)
          grep -q "hotaru-shell-v16" service-worker.js
          grep -q "app.js?v=1.3.0" service-worker.js
          grep -q "app.js?v=1.3.0" index.html
          ! grep -RIn "hotaru-shell-v15" . --exclude-dir=node_modules
          test ! -d .tmp/app
          test ! -e .github/workflows/bi2-app-finalize.yml
          git diff --check
      - name: Commit clean verified source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Finalize reviewed Build Check intelligence'
          git push origin HEAD:feature/build-intelligence-2
