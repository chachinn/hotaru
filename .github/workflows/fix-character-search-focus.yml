name: Finalize character search focus hotfix

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.ref == 'fix/character-search-mobile-focus'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/character-search-mobile-focus
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply focus-preserving search fix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          root=Path('.')
          app=(root/'app.js').read_text()
          old_input='<input id="character-search" value="${esc(state.ui.search)}" type="search" placeholder="Search character, element or weapon" autocomplete="off" />'
          new_input='<input id="character-search" value="${esc(state.ui.search)}" type="search" placeholder="Search character, element or weapon" autocomplete="off" autocapitalize="none" spellcheck="false" enterkeyhint="search" />'
          assert old_input in app
          app=app.replace(old_input,new_input,1)
          old_handler="document.addEventListener('input',event=>{if(event.target?.id==='character-search'){state.ui.search=event.target.value;state.ui.page=1;persist();clearTimeout(window.__hotaruSearch);window.__hotaruSearch=setTimeout(render,120)}})"
          new_handler="""function refreshCharacterSearchResults(){
            if(state.ui.tab!=='characters'||state.ui.characterId||!catalog)return;
            const main=$app.querySelector('main'),input=main?.querySelector('#character-search');if(!input)return;
            const all=filteredCharacters(),perPage=24,pages=Math.max(1,Math.ceil(all.length/perPage));state.ui.page=Math.min(pages,Math.max(1,n(state.ui.page,1)));const page=state.ui.page,shown=all.slice((page-1)*perPage,page*perPage),grid=main.querySelector('.grid.auto'),pagination=main.querySelector('.pagination'),count=main.querySelector('.section-head .muted.small');
            if(grid)grid.innerHTML=shown.map(c=>`<button class=\"card character-card\" data-character=\"${esc(c.id)}\"><div class=\"character-art\">${image(c.icon,c.name)}</div><div class=\"character-info\"><div class=\"character-name\">${esc(c.name)}</div><div class=\"character-meta\"><span>${esc(c.element)}</span><span>·</span><span>${esc(c.weapon)}</span><span>·</span><span>${safeCharacterRarity(c.rarity,4)}★</span></div></div></button>`).join('')||`<div class=\"card empty\"><div class=\"empty-symbol\">⌕</div><h3>No matches</h3><p>Try another filter.</p></div>`;
            if(pagination)pagination.innerHTML=`<button class=\"secondary\" data-page=\"${page-1}\" ${page<=1?'disabled':''}>Previous</button><span>${page} / ${pages}</span><button class=\"secondary\" data-page=\"${page+1}\" ${page>=pages?'disabled':''}>Next</button>`;
            if(count)count.textContent=`${all.length} matching characters`;
            document.dispatchEvent(new CustomEvent('hotaru:character-search-updated',{detail:{query:state.ui.search,page}}));
          }
          document.addEventListener('input',event=>{if(event.target?.id==='character-search'){state.ui.search=event.target.value;state.ui.page=1;persist();clearTimeout(window.__hotaruSearch);window.__hotaruSearch=setTimeout(refreshCharacterSearchResults,70)}})"""
          assert old_handler in app
          (root/'app.js').write_text(app.replace(old_handler,new_handler,1))

          enh=(root/'js/enhancements.js').read_text()
          anchor="document.addEventListener('change',event=>{\n  if(event.target?.id==='filter-region')"
          insert="document.addEventListener('hotaru:character-search-updated',()=>{\n  if(currentScreenTitle()!=='Characters')return;\n  extra.page=1;saveExtra();\n  if(enriched.length&&(extra.region!=='All'||extra.affiliation!=='All'))renderTaxonomyResults(true);\n});\n"
          assert anchor in enh
          (root/'js/enhancements.js').write_text(enh.replace("document.addEventListener('change',event=>{\n",insert+"document.addEventListener('change',event=>{\n",1))

          idx=(root/'index.html').read_text().replace('app.js?v=1.3.0','app.js?v=1.4.0').replace('js/enhancements.js?v=1.5.0','js/enhancements.js?v=1.6.0')
          (root/'index.html').write_text(idx)
          sw=(root/'service-worker.js').read_text().replace('hotaru-shell-v16','hotaru-shell-v17').replace('app.js?v=1.3.0','app.js?v=1.4.0').replace('js/enhancements.js?v=1.5.0','js/enhancements.js?v=1.6.0')
          (root/'service-worker.js').write_text(sw)
          for p in (root/'tests').glob('*.mjs'):
              s=p.read_text().replace('hotaru-shell-v16','hotaru-shell-v17').replace(r'app\.js\?v=1\.3\.0',r'app\.js\?v=1\.4\.0').replace(r'js\/enhancements\.js\?v=1\.5\.0',r'js\/enhancements\.js\?v=1\.6\.0')
              p.write_text(s)
          (root/'tests/character-search-focus-tests.mjs').write_text("""import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const app=fs.readFileSync(new URL('../app.js',import.meta.url),'utf8');
          const enhancements=fs.readFileSync(new URL('../js/enhancements.js',import.meta.url),'utf8');
          const sw=fs.readFileSync(new URL('../service-worker.js',import.meta.url),'utf8');
          const index=fs.readFileSync(new URL('../index.html',import.meta.url),'utf8');
          assert.ok(app.includes('function refreshCharacterSearchResults()'));
          assert.ok(app.includes('setTimeout(refreshCharacterSearchResults,70)'));
          assert.ok(!app.includes('window.__hotaruSearch=setTimeout(render'));
          assert.ok(app.includes("document.dispatchEvent(new CustomEvent('hotaru:character-search-updated'"));
          assert.ok(enhancements.includes("document.addEventListener('hotaru:character-search-updated'"));
          assert.ok(index.includes('app.js?v=1.4.0'));
          assert.ok(index.includes('js/enhancements.js?v=1.6.0'));
          assert.ok(sw.includes('hotaru-shell-v17'));
          console.log('Character search focus + mobile keyboard regression QA passed.');
          """)
          package=root/'package.json'; data=json.loads(package.read_text())
          if 'character-search-focus-tests.mjs' not in data['scripts']['test']:
              data['scripts']['test'] += ' && node tests/character-search-focus-tests.mjs'
          package.write_text(json.dumps(data,indent=2)+'\n')
          (root/'.github/workflows/fix-character-search-focus.yml').unlink()
          PY
      - name: Full Hotaru QA
        run: |
          set -euo pipefail
          npm test
          while IFS= read -r -d '' f; do node --check "$f" >/dev/null; done < <(find . -type f \( -name '*.js' -o -name '*.mjs' \) -not -path './node_modules/*' -print0)
          grep -q 'hotaru-shell-v17' service-worker.js
          grep -q 'app.js?v=1.4.0' index.html
          ! grep -RIn 'window.__hotaruSearch=setTimeout(render' app.js
          ! test -e .github/workflows/fix-character-search-focus.yml
          git diff --check
      - name: Commit clean hotfix tree
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix mobile character search focus and keyboard dismissal'
          git push origin HEAD:fix/character-search-mobile-focus
