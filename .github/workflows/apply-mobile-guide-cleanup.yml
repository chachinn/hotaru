name: Apply mobile guide cleanup

on:
  pull_request:
    branches:
      - main
    paths:
      - '.hotaru-mobile-cleanup.patch.gz.b64'
      - '.hotaru-mobile-cleanup.parts/**'
      - '.github/workflows/apply-mobile-guide-cleanup.yml'

permissions:
  contents: write

jobs:
  apply-cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-guide-map-cleanup
          fetch-depth: 0

      - name: Verify chunks, apply source patch, and run full QA
        shell: bash
        run: |
          set -euo pipefail

          BASE_SHA='ee8e1f17888c274a258030fdd08687e8f2a7ce7d'
          B64_SHA='b5bada7218e3342b96bdbdfa0664cba5bf1bf9a8b24f582635fe7c2f1426bdb6'
          GZ_SHA='c58cbb79a3713f6e69408d11eff88143405dbdcde98e9c575b2d703454d27c52'
          PATCH_SHA='c17ab8075c21688fb92a03a41f3bca05083587830582cf76717a0c485c90fadb'

          test "$(sha256sum .hotaru-mobile-cleanup.parts/part-00 | awk '{print $1}')" = '9d9e36798b777bac5f2b8ecf5e0e8bbcbb01ea702eeeb8cf891cb0518e218390'
          test "$(sha256sum .hotaru-mobile-cleanup.parts/part-01 | awk '{print $1}')" = '55828135e59f334850e7d973c1d3ce7ef5f06824369bf59c94d5f21f2f9d8c28'
          test "$(sha256sum .hotaru-mobile-cleanup.parts/part-02 | awk '{print $1}')" = '396c8b9a785302550071f8e892b6b36d10764dd3a156bf0f5ff2b08a77a6123c'
          test "$(sha256sum .hotaru-mobile-cleanup.parts/part-03 | awk '{print $1}')" = '3ffb46d0eab4f3b57fb2f4cf898d10523b5b1adfc86980b6309ae2b05e5be29f'
          test "$(sha256sum .hotaru-mobile-cleanup.parts/part-04 | awk '{print $1}')" = '9eb38a67cde433627d9d4d1a5189cdd1664572d921908568e1e8c7f7ad5113f3'
          test "$(sha256sum .hotaru-mobile-cleanup.parts/part-05 | awk '{print $1}')" = 'e03a66053908e7e593373da0e6b75b6149d9291f74e9dd7a308f384d9f5e6e9b'

          cat .hotaru-mobile-cleanup.parts/part-* > /tmp/hotaru-mobile-cleanup.patch.gz.b64
          test "$(sha256sum /tmp/hotaru-mobile-cleanup.patch.gz.b64 | awk '{print $1}')" = "$B64_SHA"
          base64 -d /tmp/hotaru-mobile-cleanup.patch.gz.b64 > /tmp/hotaru-mobile-cleanup.patch.gz
          test "$(sha256sum /tmp/hotaru-mobile-cleanup.patch.gz | awk '{print $1}')" = "$GZ_SHA"
          gzip -dc /tmp/hotaru-mobile-cleanup.patch.gz > /tmp/hotaru-mobile-cleanup.patch
          test "$(sha256sum /tmp/hotaru-mobile-cleanup.patch | awk '{print $1}')" = "$PATCH_SHA"

          git apply --check /tmp/hotaru-mobile-cleanup.patch
          git apply /tmp/hotaru-mobile-cleanup.patch

          npm test
          while IFS= read -r -d '' file; do node --check "$file" >/dev/null; done < <(find . -type f \( -name '*.js' -o -name '*.mjs' \) -not -path './node_modules/*' -print0)

          rm -f .hotaru-mobile-cleanup.patch.gz.b64
          rm -rf .hotaru-mobile-cleanup.parts
          rm -f .github/workflows/apply-mobile-guide-cleanup.yml

          cat > /tmp/expected-files <<'EOF'
          css/enhancements.css
          css/guide-ui.css
          index.html
          js/data/team-profiles/index.js
          js/enhancements.js
          js/features/guide-engine.js
          js/features/guide-ui.js
          js/features/interactive-map.js
          package.json
          service-worker.js
          tests/build-intelligence2-tests.mjs
          tests/build-map-fixes-tests.mjs
          tests/character-search-focus-tests.mjs
          tests/consistency-tests.mjs
          tests/game8-structure-tests.mjs
          tests/guide-tests.mjs
          tests/mobile-content-cleanup-tests.mjs
          tests/mobile-ui-regression-tests.mjs
          tests/roster2-tests.mjs
          tests/run-tests.mjs
          tests/smart-farming-tests.mjs
          tests/smart-team-creator-tests.mjs
          EOF
          sed -i 's/^          //' /tmp/expected-files
          git diff --name-only "$BASE_SHA" -- | sort > /tmp/actual-files
          sort /tmp/expected-files -o /tmp/expected-files
          diff -u /tmp/expected-files /tmp/actual-files
          test "$(git diff --diff-filter=D --name-only "$BASE_SHA" -- | wc -l)" -eq 0

          grep -q "hotaru-shell-v21" service-worker.js
          grep -q "./js/enhancements.js?v=1.7.0" service-worker.js
          grep -q "./css/enhancements.css?v=1.4.0" service-worker.js
          grep -q "./css/guide-ui.css?v=1.3.0" service-worker.js

      - name: Commit only final source files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix mobile guide teams and map planner UX'
          git push origin HEAD:fix/mobile-guide-map-cleanup
