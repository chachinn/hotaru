name: Hotaru QA

on:
  push:
    branches: [main, 'fix/**', 'feature/**', 'release/**', 'refactor/**']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply staged fix batch
        run: node scripts/apply-core-fixes-v3.mjs
      - name: Commit staged fix batch
        env:
          TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if git diff --quiet; then
            echo "No staged source changes."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app.js index.html service-worker.js js/
            git commit -m "Fix build options, guide data, and map filters"
            git push origin HEAD:"$TARGET_BRANCH"
          fi
      - name: Run deterministic/static QA
        run: npm test
      - name: Package tested Hotaru tree
        uses: actions/upload-artifact@v4
        with:
          name: hotaru-v1-tested
          compression-level: 9
          if-no-files-found: error
          include-hidden-files: true
          path: |
            .nojekyll
            .github/workflows/qa.yml
            README.md
            index.html
            app.js
            style.css
            manifest.json
            package.json
            service-worker.js
            css/
            docs/
            icons/
            js/
            tests/
