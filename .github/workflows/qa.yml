name: Hotaru QA

on:
  push:
    branches: [main, 'fix/**', 'feature/**', 'release/**', 'refactor/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run deterministic/static QA
        run: npm test
      - name: Package tested Hotaru tree
        uses: actions/upload-artifact@v4
        with:
          name: hotaru-v1-tested
          compression-level: 9
          if-no-files-found: error
          path: |
            .nojekyll
            .github/workflows/qa.yml
            README.md
            index.html
            app.js
            style.css
            manifest.json
            package.json
            service-worker.js
            css/
            docs/
            icons/
            js/
            tests/
