name: Hotaru Build Intelligence 2 Apply

on:
  push:
    branches: [feature/build-intelligence-2-release]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact tested Build Intelligence 2 tree
        shell: bash
        run: |
          set -euo pipefail
          cat tools/.bi2-release-* | base64 -d > /tmp/bi2.tar.gz
          tar -xzf /tmp/bi2.tar.gz -C .
          git checkout origin/main -- .github/workflows/qa.yml
          rm -f .github/workflows/apply-build-intelligence-2-release.yml
          rm -f tools/.bi2-release-*
          rm -f docs/.bi2-release-trigger
          npm test
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement reviewed Build Intelligence 2"
          git push origin HEAD:feature/build-intelligence-2-release
