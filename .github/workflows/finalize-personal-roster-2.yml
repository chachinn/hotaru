name: Finalize Personal Roster 2.0

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.ref == 'feature/personal-roster-2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/personal-roster-2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reconstruct, verify, and apply exact tested payload
        shell: bash
        run: |
          set -euo pipefail
          for n in 00 01 02 03 04 05 06 07; do test -f ".tmp/roster2/chunk-$n"; done
          cat .tmp/roster2/chunk-00 .tmp/roster2/chunk-01 .tmp/roster2/chunk-02 .tmp/roster2/chunk-03 .tmp/roster2/chunk-04 .tmp/roster2/chunk-05 .tmp/roster2/chunk-06 .tmp/roster2/chunk-07 > .tmp/roster2/payload-final.b64
          echo '8cf2b511090e1132251559261ae855a5053a8d25a650a12896b8447fb914c04f  .tmp/roster2/payload-final.b64' | sha256sum -c -
          base64 --decode .tmp/roster2/payload-final.b64 > .tmp/roster2/payload-final.tar.gz
          echo '20780c75fb0dbbe471e954e27258ec14f36d4fb029941ae37d0ba3eb172ad53f  .tmp/roster2/payload-final.tar.gz' | sha256sum -c -
          tar -xzf .tmp/roster2/payload-final.tar.gz -C .
          rm -rf .tmp/roster2
          rm -f .github/workflows/finalize-personal-roster-2.yml
      - name: Full Personal Roster 2.0 QA
        shell: bash
        run: |
          set -euo pipefail
          npm test
          while IFS= read -r -d '' file; do node --check "$file" >/dev/null; done < <(find . -type f \( -name '*.js' -o -name '*.mjs' \) -not -path './node_modules/*' -print0)
          grep -q 'hotaru-shell-v18' service-worker.js
          grep -q 'app.js?v=1.5.0' index.html
          grep -q 'style.css?v=1.2.0' index.html
          grep -q "SCHEMA_VERSION=3" js/core/state.js
          grep -q "hotaru.app.v3" js/core/state.js
          grep -q "hotaru.app.v2" js/core/state.js
          grep -q "js/features/roster-intelligence.js" service-worker.js
          grep -q "js/features/build-goals.js" service-worker.js
          grep -q "max='90'" app.js
          grep -q "profileVariant" js/features/build-goals.js
          ! test -e .tmp/roster2
          ! test -e .github/workflows/finalize-personal-roster-2.yml
          git diff --check
      - name: Verify exact source scope
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git fetch origin main
          python - <<'PY'
          import subprocess
          expected={
            'app.js','docs/ARCHITECTURE.md','docs/SMART_BUILD_PLAN.md','index.html','js/core/state.js',
            'js/features/build-goals.js','js/features/roster-intelligence.js','package.json','service-worker.js','style.css',
            'tests/build-intelligence2-tests.mjs','tests/build-map-fixes-tests.mjs','tests/character-search-focus-tests.mjs',
            'tests/consistency-tests.mjs','tests/game8-structure-tests.mjs','tests/guide-tests.mjs',
            'tests/mobile-ui-regression-tests.mjs','tests/roster2-tests.mjs','tests/run-tests.mjs'
          }
          actual=set(subprocess.check_output(['git','diff','--cached','--name-only','origin/main'],text=True).splitlines())
          if actual != expected:
              print('Expected only:', sorted(expected))
              print('Actual:', sorted(actual))
              raise SystemExit(1)
          print(f'Personal Roster 2.0 clean scope verified: {len(actual)} intended files.')
          PY
      - name: Commit clean verified source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add Personal Roster 2.0 and build goals'
          git push origin HEAD:feature/personal-roster-2
