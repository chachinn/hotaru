name: Diagnose Smart Farming Payload

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  diagnose:
    if: github.event.pull_request.head.ref == 'feature/smart-farming-core'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/smart-farming-core
          fetch-depth: 0
      - name: Compare staged Smart Farming payload candidates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/smartfarm-diag
          dd if=.tmp/smartfarm/part-04-06 of=/tmp/smartfarm-diag/chunk-06 bs=6000 skip=2 count=1 status=none

          cat \
            .tmp/smartfarm/chunk-00 \
            .tmp/smartfarm/part-01-03 \
            .tmp/smartfarm/part-04-06 \
            .tmp/smartfarm/chunk-07 \
            > /tmp/smartfarm-diag/original.transport.b64

          cat \
            .tmp/smartfarm/chunk-00 \
            .tmp/smartfarm/part-01-03 \
            .tmp/smartfarm/chunk-04 \
            .tmp/smartfarm/chunk-05 \
            /tmp/smartfarm-diag/chunk-06 \
            .tmp/smartfarm/chunk-07 \
            > /tmp/smartfarm-diag/corrected.transport.b64

          python - <<'PY'
          import base64, hashlib, gzip, io, tarfile
          from pathlib import Path

          root=Path('/tmp/smartfarm-diag')
          for label in ('original','corrected'):
              raw=(root/f'{label}.transport.b64').read_bytes()
              compact=b''.join(raw.split())
              print(f'[{label}] compact_base64_len={len(compact)}')
              print(f'[{label}] base64_sha256={hashlib.sha256(compact).hexdigest()}')
              try:
                  decoded=base64.b64decode(compact, validate=False)
              except Exception as exc:
                  print(f'[{label}] decode_error={exc!r}')
                  continue
              (root/f'{label}.tar.gz').write_bytes(decoded)
              print(f'[{label}] decoded_len={len(decoded)}')
              print(f'[{label}] tar_sha256={hashlib.sha256(decoded).hexdigest()}')
              try:
                  payload=gzip.decompress(decoded)
                  print(f'[{label}] gzip=PASS decompressed_len={len(payload)}')
              except Exception as exc:
                  print(f'[{label}] gzip=FAIL {exc!r}')
                  continue
              try:
                  tf=tarfile.open(fileobj=io.BytesIO(decoded), mode='r:gz')
                  names=tf.getnames()
                  print(f'[{label}] tar=PASS entries={len(names)}')
                  for name in names:
                      print(f'[{label}] entry={name}')
                  out=root/f'{label}-extract'
                  out.mkdir(exist_ok=True)
                  tf.extractall(out)
              except Exception as exc:
                  print(f'[{label}] tar=FAIL {exc!r}')
          PY

          echo 'Diagnostic only: no repository source was modified or pushed.'
          exit 1
